<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CV - Pablo Barazzutti</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============ Colores y medidas (podes cambiarlos) ============ */
  :root {
    --side: #0e1a2b;        /* fondo barra lateral */
    --side-text: #c8d3e3;
    --accent: #14b8a6;      /* turquesa */
    --accent-soft: #5eead4;
    --accent-2: #e2557f;    /* detalle rosa */
    --ink: #0f172a;
    --muted: #5b6577;
    --line: #e3e8ef;
    --chip: #eef6f5;
  }

  @page { size: A4; margin: 0; }
  @page portfolio { size: A4; margin: 14mm 14mm 12mm; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: "Inter", system-ui, sans-serif; color: var(--ink); font-size: 9pt; line-height: 1.45; background: #fff; }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3 { font-family: "Sora", "Inter", sans-serif; }

  @media screen {
    body { background: #d9dee6; padding: 24px 0; }
    .hoja, .portfolio { box-shadow: 0 6px 30px rgba(0,0,0,.18); margin: 0 auto 24px; background: #fff; }
    .portfolio { padding: 14mm; }
  }

  /* ============ Pagina 1 ============ */
  .hoja { width: 210mm; height: 297mm; display: grid; grid-template-columns: 68mm 1fr; overflow: hidden; }

  .lateral { background: var(--side); color: var(--side-text); padding: 14mm 8mm 10mm; display: flex; flex-direction: column; gap: 6.5mm; position: relative; }
  .lateral::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3mm; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .foto { width: 40mm; height: 40mm; border-radius: 50%; overflow: hidden; margin: 0 auto; border: 1.2mm solid rgba(94,234,212,.35); }
  .foto img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.09); }

  .lateral h2 { font-size: 8pt; letter-spacing: .16em; text-transform: uppercase; color: #fff; font-weight: 600; margin-bottom: 2.6mm; display: flex; align-items: center; gap: 2mm; }
  .lateral h2::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.14); }

  .contacto li { list-style: none; display: flex; align-items: center; gap: 2.6mm; margin-bottom: 2mm; font-size: 8.4pt; }
  .contacto svg { width: 3.6mm; height: 3.6mm; flex: none; stroke: var(--accent-soft); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .grupo { margin-bottom: 2.4mm; }
  .grupo b { display: block; font-size: 7.4pt; color: var(--accent-soft); font-weight: 600; margin-bottom: 1mm; letter-spacing: .03em; }
  .chips { display: flex; flex-wrap: wrap; gap: 1.2mm; }
  .chips span { font-size: 7.4pt; padding: .5mm 2mm; border-radius: 10mm; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); color: #e6edf6; }
  .ia .chips span { background: rgba(20,184,166,.18); border-color: rgba(94,234,212,.35); }
  .ia p { font-size: 7.8pt; margin-top: 2mm; line-height: 1.5; }

  .idioma { margin-bottom: 1.8mm; font-size: 8.2pt; }
  .idioma b { color: #fff; font-weight: 600; }
  .idioma span { display: block; font-size: 7.6pt; }

  .principal { padding: 14mm 12mm 10mm 11mm; display: flex; flex-direction: column; }
  .cabecera h1 { font-size: 25pt; line-height: 1.08; letter-spacing: -.02em; font-weight: 700; }
  .cabecera h1 span { color: var(--accent); }
  .cabecera p { font-size: 10.5pt; font-weight: 500; color: var(--muted); margin-top: 1.6mm; }

  .seccion { margin-top: 6.5mm; }
  .seccion > h2 { font-size: 10.5pt; font-weight: 600; display: flex; align-items: center; gap: 2.4mm; margin-bottom: 3mm; }
  .seccion > h2::before { content: ""; width: 5mm; height: 1.2mm; border-radius: 1mm; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .seccion > h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .perfil { color: #334155; font-size: 9pt; }

  .trabajo { position: relative; padding-left: 5mm; padding-bottom: 3.4mm; }
  .trabajo::before { content: ""; position: absolute; left: .6mm; top: 1.6mm; width: 2mm; height: 2mm; border-radius: 50%; background: var(--accent); }
  .trabajo::after { content: ""; position: absolute; left: 1.5mm; top: 4.4mm; bottom: 0; width: 1px; background: var(--line); }
  .trabajo:last-of-type::after { display: none; }
  .trabajo .fila { display: flex; justify-content: space-between; align-items: baseline; gap: 3mm; }
  .trabajo h3 { font-size: 9.6pt; font-weight: 600; }
  .trabajo .fecha { font-size: 7.8pt; font-weight: 600; color: var(--accent); white-space: nowrap; background: var(--chip); padding: .3mm 2mm; border-radius: 10mm; }
  .trabajo .empresa { font-size: 8.4pt; color: var(--muted); }
  .trabajo .empresa b { color: var(--ink); font-weight: 600; }
  .trabajo ul { margin-top: 1.2mm; padding-left: 3.6mm; }
  .trabajo li { margin-bottom: .6mm; color: #334155; font-size: 8.5pt; }
  .trabajo li::marker { color: var(--accent); }
  .otras { font-size: 8.2pt; color: var(--muted); font-style: italic; padding-left: 5mm; }

  .formacion { display: grid; grid-template-columns: 1fr 1fr; gap: 2mm 5mm; }
  .curso { font-size: 8.4pt; line-height: 1.35; padding-left: 3mm; border-left: 2px solid var(--line); }
  .curso b { display: block; font-weight: 600; }
  .curso span { color: var(--muted); font-size: 7.8pt; }
  .curso a { color: var(--accent); font-weight: 600; font-size: 7.6pt; }
  .curso.ancho { grid-column: 1 / -1; }

  .pie { margin-top: auto; padding-top: 4mm; font-size: 7.6pt; color: var(--muted); display: flex; justify-content: space-between; border-top: 1px solid var(--line); }
  .pie a { color: var(--accent); font-weight: 600; }

  /* ============ Portfolio (pagina 2 en adelante) ============ */
  .portfolio { page: portfolio; width: 210mm; }
  @media print { .portfolio { width: auto; } }
  .portfolio .titulo { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--line); padding-bottom: 4mm; margin-bottom: 6mm; }
  .portfolio .titulo h2 { font-size: 20pt; letter-spacing: -.02em; }
  .portfolio .titulo h2 span { color: var(--accent); }
  .portfolio .titulo p { color: var(--muted); font-size: 8.6pt; margin-top: 1mm; }
  .portfolio .titulo .nombre { font-size: 8pt; color: var(--muted); text-align: right; }
  .portfolio .titulo .nombre b { display: block; color: var(--ink); font-family: "Sora"; font-size: 9pt; }

  .grilla { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5mm 4mm; }
  .sitio { break-inside: avoid; display: block; }
  .sitio .img { aspect-ratio: 16 / 10; border-radius: 2mm; overflow: hidden; border: 1px solid var(--line); background: linear-gradient(135deg, var(--side), #1d3a4f); position: relative; }
  .sitio .img img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; position: relative; z-index: 1; }
  .sitio .img .sin { position: absolute; inset: 0; display: grid; place-items: center; color: var(--accent-soft); font: 600 8pt "Sora"; text-align: center; padding: 2mm; }
  .sitio h3 { font-size: 8.2pt; font-weight: 600; margin-top: 2mm; line-height: 1.25; }
  .sitio .dom { font-size: 7.2pt; color: var(--accent); font-weight: 500; }
  .sitio .meta { font-size: 6.9pt; color: var(--muted); display: flex; gap: 1.5mm; align-items: center; margin-top: .4mm; }
  .sitio .meta i { white-space: nowrap; font-style: normal; padding: .1mm 1.6mm; border-radius: 10mm; background: var(--chip); color: #0f766e; font-weight: 600; }
</style>
</head>
<body>

<div class="hoja">
  <aside class="lateral">
    <div class="foto"><img id="foto" alt=""></div>
    <section><h2>Contacto</h2><ul class="contacto" id="contacto"></ul></section>
    <section><h2>Habilidades</h2><div id="habilidades"></div></section>
    <section class="ia"><h2>IA aplicada</h2><div class="chips" id="ia-chips"></div><p id="ia-texto"></p></section>
    <section><h2>Idiomas</h2><div id="idiomas"></div></section>
  </aside>

  <main class="principal">
    <header class="cabecera"><h1 id="nombre"></h1><p id="titulo"></p></header>
    <section class="seccion"><h2>Perfil</h2><p class="perfil" id="perfil"></p></section>
    <section class="seccion"><h2>Experiencia</h2><div id="experiencia"></div><p class="otras" id="otras"></p></section>
    <section class="seccion"><h2>Formación</h2><div class="formacion" id="formacion"></div></section>
    <div class="pie"><span id="pie-izq"></span><span>Portfolio completo en la página siguiente · <a id="pie-link"></a></span></div>
  </main>
</div>

<section class="portfolio">
  <div class="titulo">
    <div><h2>Portfolio<span>.</span></h2><p id="port-sub"></p></div>
    <div class="nombre" id="port-nombre"></div>
  </div>
  <div class="grilla" id="grilla"></div>
</section>

<script src="../datos.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const iconos = {
    mail: '<path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/>',
    tel:  '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
    pin:  '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    web:  '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  };
  const link = (href, html) => href ? `<a href="${esc(href)}">${html}</a>` : html;

  // Nombre con el apellido resaltado
  const partes = CV.nombre.split(" ");
  $("nombre").innerHTML = esc(partes.slice(0, -1).join(" ")) + " <span>" + esc(partes.at(-1)) + "</span>";
  $("titulo").textContent = CV.titulo;
  $("foto").src = "../" + CV.foto;
  $("perfil").textContent = CV.perfil;

  $("contacto").innerHTML = CV.contacto.map((c) =>
    `<li><svg viewBox="0 0 24 24">${iconos[c.icono] || iconos.web}</svg>${link(c.link, esc(c.texto))}</li>`).join("");

  $("habilidades").innerHTML = CV.habilidades.map((g) =>
    `<div class="grupo"><b>${esc(g.grupo)}</b><div class="chips">${g.items.map((i) => `<span>${esc(i)}</span>`).join("")}</div></div>`).join("");

  $("ia-chips").innerHTML = CV.ia.herramientas.map((i) => `<span>${esc(i)}</span>`).join("");
  $("ia-texto").textContent = CV.ia.texto;

  $("idiomas").innerHTML = CV.idiomas.map((i) =>
    `<div class="idioma"><b>${esc(i.idioma)}</b><span>${esc(i.nivel)}</span></div>`).join("");

  $("experiencia").innerHTML = CV.experiencia.map((e) => {
    const fecha = e.hasta ? `${e.desde} – ${e.hasta}` : e.desde;
    const tareas = e.tareas.length ? `<ul>${e.tareas.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : "";
    return `<div class="trabajo">
      <div class="fila"><h3>${esc(e.puesto)}</h3><span class="fecha">${esc(fecha)}</span></div>
      <div class="empresa"><b>${esc(e.empresa)}</b> · ${esc(e.lugar)}</div>${tareas}</div>`;
  }).join("");
  $("otras").textContent = CV.otrasExperiencias;

  $("formacion").innerHTML = CV.formacion.map((f) => {
    const sub = [f.lugar, f.anio].filter(Boolean).join(" · ");
    const det = f.detalle ? ` · ${esc(f.detalle)}` : "";
    const cert = f.certificado ? ` · <a href="${esc(CV.sitio + f.certificado)}">Ver certificado ↗</a>` : "";
    const ancho = !f.certificado ? " ancho" : "";
    return `<div class="curso${ancho}"><b>${esc(f.titulo)}</b><span>${esc(sub)}${det}</span>${cert}</div>`;
  }).join("");

  $("pie-izq").textContent = CV.nombre;
  $("pie-link").href = CV.sitio;
  $("pie-link").textContent = CV.sitio.replace(/^https?:\/\//, "").replace(/\/$/, "");

  // ---- Portfolio ----
  const n = CV.portfolio.length;
  $("port-sub").textContent = `${n} sitios web desarrollados y publicados · clic en cada uno para visitarlo`;
  $("port-nombre").innerHTML = `<b>${esc(CV.nombre)}</b>${esc(CV.titulo)}`;
  $("grilla").innerHTML = CV.portfolio.map((s) => {
    const dom = new URL(s.url).hostname.replace(/^www\./, "");
    return `<a class="sitio" href="${esc(s.url)}">
      <div class="img"><span class="sin">${esc(dom)}</span><img src="../${CV.captura(s.url)}" alt="" onerror="this.remove()"></div>
      <h3>${esc(s.nombre)}</h3>
      <div class="dom">${esc(dom)}</div>
      <div class="meta"><i>${esc(s.plataforma)}</i>${esc(s.rubro)}</div></a>`;
  }).join("");
</script>
</body>
</html>
